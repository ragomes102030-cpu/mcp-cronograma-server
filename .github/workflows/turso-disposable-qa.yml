name: Turso disposable QA (manual, protected)

on:
  workflow_dispatch:
    inputs:
      confirm_disposable:
        description: "Type YES_DISPOSABLE_WRITES only after creating a NEW EMPTY Turso QA database."
        type: string
        required: true

permissions:
  contents: read

jobs:
  disposable-remote-qa:
    if: ${{ inputs.confirm_disposable == 'YES_DISPOSABLE_WRITES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        driver: [legacy, libsql]
    env:
      TURSO_TEST_DATABASE_URL: ${{ secrets.QA_TURSO_DATABASE_URL }}
      TURSO_TEST_AUTH_TOKEN: ${{ secrets.QA_TURSO_AUTH_TOKEN }}
      TURSO_PRODUCTION_DATABASE_URL: ${{ vars.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_REMOTE_TEST_CONFIRM: ${{ inputs.confirm_disposable }}
      TURSO_DRIVER: ${{ matrix.driver }}
      VERCEL: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Refuse absent QA database settings
        run: |
          python - <<'PY'
          import os
          required = (
              "TURSO_TEST_DATABASE_URL", "TURSO_TEST_AUTH_TOKEN",
              "TURSO_PRODUCTION_DATABASE_URL",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing QA-only credentials or production URL reference. No writes.")
          if os.environ.get("TURSO_REMOTE_TEST_CONFIRM") != "YES_DISPOSABLE_WRITES":
              raise SystemExit("Disposable write confirmation absent.")
          print("QA configuration present; database identity will be rechecked in pytest.")
          PY
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test remote QA CRUD and atomic baseline revisions
        run: python -m pytest tests/test_turso_disposable_roundtrip.py -m remote_turso -q
